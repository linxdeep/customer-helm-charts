name: Debug token permissions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Show effective token permissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "repo API view as token identity:"
          gh api repos/linxdeep/customer-helm-charts --jq '.permissions'
          echo "attempting release create/delete:"
          gh release create "debug-perm-$GITHUB_RUN_NUMBER" --title debug --notes debug --target main
          gh release delete "debug-perm-$GITHUB_RUN_NUMBER" --yes
          git clone --depth 1 https://x-access-token:${GH_TOKEN}@github.com/linxdeep/customer-helm-charts /tmp/pushtest 2>/dev/null || true
