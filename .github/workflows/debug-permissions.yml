name: Debug token permissions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Show effective token permissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/linxdeep/customer-helm-charts --jq '.permissions'
          gh release create "debug-perm-$GITHUB_RUN_NUMBER" --title debug --notes debug
          gh release delete "debug-perm-$GITHUB_RUN_NUMBER" --yes
          echo "RELEASE CREATE/DELETE OK"
