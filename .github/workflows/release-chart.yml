# Packages the chart under charts/uem and pushes it as an OCI artifact to the
# public AWS ECR registry public.ecr.aws/uem (repository "helm-charts").
#
# Release flow: bump `version` in charts/uem/Chart.yaml and push to main.
# OCI tags are immutable, so every chart change needs a version bump; the
# push is skipped when that version already exists in the registry.
#
# Authentication assumes an IAM role via GitHub OIDC (no stored secrets):
# arn:aws:iam::068002804222:role/helm-charts. The role must trust
# token.actions.githubusercontent.com for this repository and hold the
# ecr-public push permissions. ecr-public is us-east-1 only.
name: Release Chart

on:
  push:
    branches: [main]
    paths: ["charts/**"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # assume the release role via GitHub OIDC

concurrency:
  group: release-chart
  cancel-in-progress: false

env:
  REGISTRY: public.ecr.aws
  ALIAS: uem # public registry alias, i.e. public.ecr.aws/uem
  REPOSITORY: helm-charts # bare repository name, no alias prefix
  ROLE_ARN: arn:aws:iam::068002804222:role/helm-charts

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Lint charts
        run: helm lint charts/*

      - name: Debug OIDC token claims (temporary)
        run: |
          IDTOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r '.value')
          echo "$IDTOKEN" | cut -d'.' -f2 | python3 -c \
            "import sys,base64,json; d=sys.stdin.read().strip(); d+='='*(-len(d)%4); print(json.dumps(json.loads(base64.urlsafe_b64decode(d)), indent=2))" \
            | grep -E '"(sub|aud|iss|repository)"'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: us-east-1

      - name: Login to the registry
        run: |
          aws ecr-public get-login-password --region us-east-1 \
            | helm registry login -u AWS --password-stdin "$REGISTRY"

      - name: Package chart
        id: package
        run: |
          VERSION="$(sed -n 's/^version: *//p' charts/uem/Chart.yaml | head -n1)"
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"
          helm package charts/uem

      - name: Check whether this version is already released
        id: released
        run: |
          if aws ecr-public describe-images \
              --repository-name "$REPOSITORY" \
              --image-ids "imageTag=${{ steps.package.outputs.version }}" \
              >/dev/null 2>&1; then
            echo "exists=true" >>"$GITHUB_OUTPUT"
            echo "::notice::${REGISTRY}/${ALIAS}/${REPOSITORY}:${{ steps.package.outputs.version }} is already released, skipping push"
          else
            echo "exists=false" >>"$GITHUB_OUTPUT"
          fi

      - name: Push chart
        if: steps.released.outputs.exists == 'false'
        run: |
          helm push "uem-${{ steps.package.outputs.version }}.tgz" "oci://${REGISTRY}/${ALIAS}/${REPOSITORY}"
