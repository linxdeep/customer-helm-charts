{{- if .Values.processor.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "uem.processorFullname" . }}
  labels:
    {{- include "uem.processorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.apple.service.type }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "uem.processorSelectorLabels" . | nindent 4 }}
{{- end -}}