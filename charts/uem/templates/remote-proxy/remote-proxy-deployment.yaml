{{- if .Values.remoteProxy.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{- include "uem.remoteProxyFullname" . }}
  labels:
    {{- include "uem.remoteProxyLabels" . | nindent 4 }}
spec:
  {{- if not .Values.remoteProxy.autoscaling.enabled }}
  replicas: {{ .Values.remoteProxy.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "uem.remoteProxySelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.remoteProxy.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "uem.remoteProxySelectorLabels" . | nindent 8 }}
    spec:
      {{- include "uem.imagePullSecrets" (dict "root" $ "imagePullSecrets" .Values.remoteProxy.imagePullSecrets) | nindent 6 }}
      {{/*      serviceAccountName: {{ include "helm-charts.serviceAccountName" . }}*/}}
      securityContext:
        {{- toYaml .Values.remoteProxy.podSecurityContext | nindent 8 }}
      {{- include "wait-for-emqx" . | nindent 6 }}
      containers:
        - name: {{- include "uem.remoteProxyFullname" . }}
          securityContext:
            {{- toYaml .Values.remoteProxy.securityContext | nindent 12 }}
          image: {{ include "uem.image" (dict "root" $ "image" .Values.remoteProxy.image) }}
          imagePullPolicy: {{ .Values.remoteProxy.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9097
              protocol: TCP
            - name: grpc
              containerPort: 9099
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
            initialDelaySeconds: 60
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
            initialDelaySeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - mountPath: /data/conf/config.yaml
              subPath: config.yaml
              name: config
            {{- include "middleware-config" . | nindent 10 }}
          resources:
            {{- toYaml .Values.remoteProxy.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{- include "uem.remoteProxyFullname" . }}
        - name: middleware-config
          configMap:
            name: middleware
      {{- with .Values.remoteProxy.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.remoteProxy.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.remoteProxy.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}