{{- if .Values.bff.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uem.bffFullname" . }}
  labels:
    {{- include "uem.bffLabels" . | nindent 4 }}
spec:
  {{- if not .Values.bff.autoscaling.enabled }}
  replicas: {{ .Values.bff.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "uem.bffSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.bff.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "uem.bffSelectorLabels" . | nindent 8 }}
    spec:
      {{- include "wait-for-emqx" . | nindent 6 }}
      {{- include "uem.imagePullSecrets" (dict "root" $ "imagePullSecrets" .Values.bff.imagePullSecrets) | nindent 6 }}
      {{/*      serviceAccountName: {{ include "helm-charts.serviceAccountName" . }}*/}}
      securityContext:
        {{- toYaml .Values.bff.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "uem.bffFullname" . }}
          securityContext:
            {{- toYaml .Values.bff.securityContext | nindent 12 }}
          image: {{ include "uem.image" (dict "root" $ "image" .Values.bff.image) }}
          imagePullPolicy: {{ .Values.bff.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9092
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
            initialDelaySeconds: 60
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
            initialDelaySeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - mountPath: /data/conf/config.yaml
              subPath: config.yaml
              name: config
            - mountPath: /tmp
              name: tmp
            {{- include "middleware-config" . | nindent 10 }}
          resources:
            {{- toYaml .Values.bff.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "uem.bffFullname" . }}
        - name: middleware-config
          configMap:
            name: middleware
        - name: tmp
          emptyDir: {}
      {{- with .Values.bff.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bff.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.bff.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}