{{- if .Values.www.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{- include "uem.wwwFullname" . }}
  labels:
    {{- include "uem.wwwLabels" . | nindent 4 }}
spec:
  {{- if not .Values.www.autoscaling.enabled }}
  replicas: {{ .Values.www.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "uem.wwwSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.www.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "uem.wwwSelectorLabels" . | nindent 8 }}
    spec:
      {{- include "uem.imagePullSecrets" (dict "root" $ "imagePullSecrets" .Values.www.imagePullSecrets) | nindent 6 }}
      {{/*      serviceAccountName: {{ include "helm-charts.serviceAccountName" . }}*/}}
      securityContext:
        {{- toYaml .Values.www.podSecurityContext | nindent 8 }}
      containers:
        - name: {{- include "uem.wwwFullname" . }}
          securityContext:
            {{- toYaml .Values.www.securityContext | nindent 12 }}
          image: {{ include "uem.image" (dict "root" $ "image" .Values.www.image) }}
          imagePullPolicy: {{ .Values.www.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 3
            initialDelaySeconds: 60
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 30
            failureThreshold: 3
            initialDelaySeconds: 10
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.www.resources | nindent 12 }}
      {{- with .Values.www.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.www.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.www.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}