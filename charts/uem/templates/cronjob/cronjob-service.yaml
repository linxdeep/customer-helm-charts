{{- if .Values.cronjob.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "uem.cronjobFullname" . }}
  labels:
    {{- include "uem.cronjobLabels" . | nindent 4 }}
spec:
  type: {{ .Values.apple.service.type }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "uem.cronjobSelectorLabels" . | nindent 4 }}
{{- end -}}