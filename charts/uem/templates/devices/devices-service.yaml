{{- if .Values.devices.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "uem.devicesFullname" . }}
  labels:
    {{- include "uem.devicesLabels" . | nindent 4 }}
spec:
  type: {{ .Values.apple.service.type }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "uem.devicesSelectorLabels" . | nindent 4 }}
{{- end -}}