{{- if and .Values.deviceStats.enabled .Values.deviceStats.metrics .Values.monitoring.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "uem.deviceStatsFullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- toYaml .Values.monitoring.labels | nindent 4 }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "uem.deviceStatsFullname" . }}
  endpoints:
  - port: http
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
{{- end -}}