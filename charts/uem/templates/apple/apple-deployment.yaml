{{- if .Values.apple.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "uem.appleFullname" . }}
  labels:
    {{- include "uem.appleLabels" . | nindent 4 }}
spec:
  {{- if not .Values.apple.autoscaling.enabled }}
  replicas: {{ .Values.apple.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "uem.appleSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.apple.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "uem.appleSelectorLabels" . | nindent 8 }}
    spec:
      {{- include "wait-for-devices" . | nindent 6 }}
      {{- include "uem.imagePullSecrets" (dict "root" $ "imagePullSecrets" .Values.apple.imagePullSecrets) | nindent 6 }}
      {{/*      serviceAccountName: {{ include "helm-charts.serviceAccountName" . }}*/}}
      securityContext:
        {{- toYaml .Values.apple.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ include "uem.appleFullname" . }}
          securityContext:
            {{- toYaml .Values.apple.securityContext | nindent 12 }}
          image: {{ include "uem.image" (dict "root" $ "image" .Values.apple.image) }}
          imagePullPolicy: {{ .Values.apple.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 9093
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
            initialDelaySeconds: 60
            timeoutSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            failureThreshold: 3
            initialDelaySeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - mountPath: /data/conf/config.yaml
              subPath: config.yaml
              name: config
            - mountPath: /app/downloads
              name: downloads
            {{- include "middleware-config" . | nindent 10 }}
          resources:
            {{- toYaml .Values.apple.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "uem.appleFullname" . }}
        - name: downloads
          {{- include "pvc" . | nindent 10 }}
        - name: middleware-config
          configMap:
            name: middleware
      {{- with .Values.apple.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apple.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apple.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}