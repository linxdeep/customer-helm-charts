{{- if .Values.apple.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "uem.appleFullname" . }}
  labels:
    {{- include "uem.appleLabels" . | nindent 4 }}
spec:
  type: {{ .Values.apple.service.type }}
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "uem.appleSelectorLabels" . | nindent 4 }}
{{- end -}}