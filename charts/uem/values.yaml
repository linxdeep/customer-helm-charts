# Default values for the uem chart.
#
# IMPORTANT: this chart deploys the application services only. All middleware
# (Cassandra, Redis, Kafka, EMQX, Elasticsearch) must be deployed beforehand.
# See docs/ in the repository root for the required versions and examples.

# -- Global settings applied to every service.
global:
  # -- Optional registry prefix prepended to every image, e.g. "registry.example.com".
  # Service images below are then referenced as <registry>/<repository>:<tag>.
  imageRegistry: ""
  # -- Pull secrets merged into every pod. Example: [{ name: regcred }]
  imagePullSecrets: []
  # -- Image used by init containers that need kubectl.
  kubectlImage: "docker.io/bitnami/kubectl:latest"
  # -- Image used by the EMQX bootstrap job (curl).
  curlImage: "docker.io/curlimages/curl:latest"
  # -- Image used by init containers waiting on other resources.
  waitForImage: "ghcr.io/groundnuty/k8s-wait-for:v2.0"

fullnameOverride: uem

# -- Public domain of this deployment, e.g. uem.example.com.
# The console and all HTTP APIs are served under this host (and *.<domain>).
domain: ""

# -- License string.
license: ""

# -- Shared persistent volume for the file service and device uploads.
pvc:
  enabled: false
  storage: 16Gi
  # -- Storage class for the PVC. Leave empty to use the cluster default.
  storageClass: ""
  # -- Set to "s3" to skip the PVC (files stored in object storage only).
  type: ""

# -- Outgoing email (SMTP) settings.
email:
  smtp: ""
  port: 465
  username: ""
  password: ""

# -- OpenTelemetry export. Disabled by default.
otel:
  endpoint: ""
  enable: false
  insecure: true
  protocol: grpc

# -- S3-compatible object storage used for attachments and files.
s3:
  enabled: true
  region: ""
  accessKey: ""
  secretKey: ""
  bucketName: ""
  # -- Public URL of the bucket (or CDN in front of it), e.g. https://files.example.com
  domain: ""

# -- AWS Secrets Manager integration (optional, AWS environments only).
secretManager:
  enable: false
  region: ""
  prefix: ""
  accessKey: ""
  secretKey: ""

# -- Search engine settings. Elasticsearch only (deployed outside this chart).
search:
  type: es
  deviceIndexPrefix: devices
  es:
    # -- Elasticsearch endpoints, e.g. ["https://elasticsearch-es-http.search:9200"]
    addresses: []
    username: "elastic"
    password: ""
    insecureSkipVerify: true
    maxRetries: 3
    timeout: 10s

# -- Redis connection (deployed outside this chart).
redis:
  # -- host:port reachable from inside the cluster, e.g. redis-master:6379
  addr: ""
  # -- Set true when pointing at a Redis Cluster deployment.
  cluster: false

# -- Kafka connection (deployed outside this chart).
kafka:
  enabled: true
  # -- Broker list, e.g. ["my-cluster-kafka-bootstrap:9092"]
  brokerList: []
  groupId: "uem"

# -- Cassandra connection (deployed outside this chart).
db:
  address: ""
  pool: 2
  timeout: 60
  keyspace: ""
  username: ""
  password: ""
  replication: 1
  secretName: ""
  keyspaceClass:
    # The class of the keyspace, e.g. SimpleStrategy, NetworkTopologyStrategy
    keyspaceClass: SimpleStrategy
    # dataCenter: A map of data centers and their replication factor.
    # It is only used when keyspaceClass is NetworkTopologyStrategy.
    # dataCenter:
    #  -dc1: 3

# -- MQTT settings (credentials for the externally deployed EMQX cluster).
mqtt:
  id: ""
  username: ""
  password: ""
  version: 5
  apiKey: ""
  apiSecret: ""
  # -- Public hostname devices connect to, e.g. mqtt.example.com
  external: ""
  tcpPort: "1883"
  sslPort: "8883"

# -- EMQX cluster connection. EMQX itself is deployed outside this chart
# (see docs/middleware-emqx.md).
emqx:
  # -- MQTT listener of the EMQX cluster, host:port, e.g. emqx:1883
  address: "emqx:1883"
  # -- Management API of the EMQX cluster, host:port, e.g. emqx:18083
  apiAddress: "emqx:18083"
  # -- Dashboard admin password of the EMQX cluster. Must match the password
  # configured when the cluster was deployed.
  adminPassword: ""
  bootstrap:
    # -- Post-install job that provisions the EMQX API key and business rules.
    enabled: true

# -- Partner portal server advertised to clients.
partner:
  server: ""

http:
  lbMode: true
  ginMode: release

# -- Standard Kubernetes Ingress. Disabled by default: the routing rules are
# documented in docs/ingress-routing.md so you can use any ingress controller.
ingress:
  enabled: false
  className: ""
  annotations: {}
  # -- Additional hosts served by the generated Ingress.
  extraHosts: []
  # -- TLS configuration, e.g. [{ secretName: uem-tls, hosts: [uem.example.com] }]
  tls: []
  attachmentRoute:
    # -- Route /api/attachment to the file service. NOTE: standard Ingress
    # rules cannot match by HTTP method, enable only after verifying your
    # upload flow. See docs/ingress-routing.md.
    enabled: false
  grpc:
    # -- Separate Ingress for the remote-proxy gRPC endpoint. Requires an
    # ingress controller with gRPC support.
    enabled: false
    # Example for nginx:
    #   nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
    annotations: {}

# -- Prometheus ServiceMonitor resources. Requires the prometheus operator.
monitoring:
  enabled: false
  # -- Labels added to every ServiceMonitor so your Prometheus picks it up,
  # e.g. { release: kube-prometheus-stack }
  labels: {}

# -- External AI service (optional).
ai:
  server: ""
  headers: {}
    # Example:
    # X-Root-API-Key: xxx
    # X-Root-Project-ID: 00000000-0000-0000-0000-000000000000

